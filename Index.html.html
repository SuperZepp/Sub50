<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Track Coach</title>
<style>
:root{
  --bg:#f5f5f3;--surface:#fff;--text:#1a1a1a;--sub:#666;--accent:#c9a227;
  --border:#e5e5e0;--danger:#c0392b;--ok:#2e7d32;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15151a;--surface:#1f1f26;--text:#eee;--sub:#999;--accent:#d4af37;--border:#2d2d35;
  }
}
:root[data-theme="dark"]{--bg:#15151a;--surface:#1f1f26;--text:#eee;--sub:#999;--accent:#d4af37;--border:#2d2d35;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;height:100%;display:flex;flex-direction:column;}
html,body{height:100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);}
header{position:sticky;top:0;padding:env(safe-area-inset-top,0px) 16px 12px;background:var(--surface);border-bottom:1px solid var(--border);z-index:5;}
header h1{font-size:18px;margin:12px 0 0;font-weight:700;}
header p{margin:2px 0 0;font-size:12px;color:var(--sub);}
main{flex:1;overflow-y:auto;padding:12px 16px 90px;}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;}
nav button{flex:1;background:none;border:none;padding:12px 0 10px;font-size:11px;color:var(--sub);font-family:inherit;}
nav button.active{color:var(--accent);font-weight:700;}
.view{display:none;}
.view.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
button.primary{background:var(--accent);color:#1a1a1a;border:none;padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;}
.row{display:flex;gap:8px;margin-bottom:10px;}
.row>*{flex:1;}
.chat-bubble{padding:10px 12px;border-radius:12px;margin-bottom:8px;max-width:85%;font-size:14px;line-height:1.4;white-space:pre-wrap;}
.chat-bubble.user{background:var(--accent);color:#1a1a1a;margin-left:auto;}
.chat-bubble.coach{background:var(--surface);border:1px solid var(--border);}
.chat-input{position:fixed;bottom:52px;left:0;right:0;display:flex;gap:8px;padding:8px 12px;background:var(--bg);border-top:1px solid var(--border);}
.chat-input textarea{resize:none;height:40px;}
#chatlog{padding-bottom:10px;}
.entry-meta{font-size:11px;color:var(--sub);margin-bottom:4px;}
.rem-row{display:flex;align-items:center;gap:10px;}
.rem-row input[type=checkbox]{width:auto;}
.rem-text.done{text-decoration:line-through;color:var(--sub);}
.del{color:var(--danger);font-size:12px;background:none;border:none;}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:24px 0;}
</style>
</head>
<body>
<header><h1 id="headerTitle">🏃 Coach</h1><p id="headerSub">Loading...</p></header>
<main>
  <section id="view-chat" class="view active">
    <div id="chatlog"></div>
  </section>
  <section id="view-log" class="view">
    <div class="card">
      <div class="row">
        <select id="logType"><option>Session</option><option>Note</option><option>Measurement</option></select>
        <input id="logDate" type="date">
      </div>
      <textarea id="logText" rows="2" placeholder="What happened..."></textarea>
      <div style="margin-top:8px;"><button class="primary" onclick="addLog()">Add Entry</button></div>
    </div>
    <div id="logList"></div>
  </section>
  <section id="view-reminders" class="view">
    <div class="card row">
      <input id="remText" placeholder="New reminder...">
      <button class="primary" onclick="addReminder()" style="flex:0 0 auto;">Add</button>
    </div>
    <div id="remList"></div>
  </section>
</main>
<div class="chat-input" id="chatInputBar" style="display:none;">
  <textarea id="chatMsg" placeholder="Ask your coach..."></textarea>
  <button class="primary" onclick="sendChat()" style="flex:0 0 auto;">Send</button>
</div>
<nav>
  <button class="active" onclick="switchView('chat')">💬 Coach</button>
  <button onclick="switchView('log')">📋 Log</button>
  <button onclick="switchView('reminders')">⏰ Reminders</button>
</nav>
<script>
let db, user, sample, uid;
let chatHistory = [];

function switchView(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('chatInputBar').style.display = v==='chat' ? 'flex' : 'none';
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

async function init(){
  try{
    db = await claude.use('db');
    user = await claude.use('user');
    sample = await claude.use('sample');
    if(user){ uid = await user.id(); }
  }catch(e){}
  document.getElementById('headerSub').textContent = db ? 'Synced' : 'Local session only';
  document.getElementById('logDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('chatInputBar').style.display='flex';
  pushCoach("Yo. I'm your coach — ask me anything about today's session, your program, or log how training went. I can see your saved log and reminders if you mention them.");
  loadLogs();
  loadReminders();
}

function pushUser(t){chatHistory.push({role:'user',content:t});renderChat();}
function pushCoach(t){chatHistory.push({role:'assistant',content:t});renderChat();}
function renderChat(){
  const el = document.getElementById('chatlog');
  el.innerHTML = chatHistory.map(m=>`<div class="chat-bubble ${m.role==='user'?'user':'coach'}">${esc(m.content)}</div>`).join('');
  el.scrollIntoView({block:'end'});
  window.scrollTo(0,document.body.scrollHeight);
}

async function sendChat(){
  const box = document.getElementById('chatMsg');
  const text = box.value.trim();
  if(!text) return;
  box.value='';
  pushUser(text);
  if(!sample){ pushCoach("Chat isn't available in this view right now."); return; }
  pushCoach("...");
  try{
    const sys = "You are a direct, data-driven athletics coach for a 400m sprinter (56s+ PB) currently in GPP1 of a 26-week plan toward an April 2027 400m target, started 12 Oct 2026. Be concise, factual, no fluff. Give concrete prescriptions.";
    const input = [{role:'user',content:sys}, ...chatHistory.slice(0,-1).filter(m=>m.content!=='...')];
    const res = await sample(input);
    chatHistory[chatHistory.length-1] = {role:'assistant',content:res.text};
    renderChat();
  }catch(e){
    chatHistory[chatHistory.length-1] = {role:'assistant',content:"Couldn't reach the coach model right now. Try again."};
    renderChat();
  }
}

async function addLog(){
  const type = document.getElementById('logType').value;
  const date = document.getElementById('logDate').value;
  const text = document.getElementById('logText').value.trim();
  if(!text) return;
  const entry = {type,date,text,ts:Date.now()};
  if(db && uid){
    const id = 'l'+Date.now();
    await db.collection('data/users/'+uid+'/logs').doc(id).set(entry);
  }
  document.getElementById('logText').value='';
  loadLogs();
}

async function loadLogs(){
  const el = document.getElementById('logList');
  if(!db || !uid){ el.innerHTML='<div class="empty">Sign in to sync your log.</div>'; return; }
  try{
    const res = await db.collection('data/users/'+uid+'/logs').orderBy('ts','desc').limit(50).get();
    const docs = res.docs || res || [];
    if(!docs.length){ el.innerHTML='<div class="empty">No entries yet.</div>'; return; }
    el.innerHTML = docs.map(d=>{
      const v = d.data ? d.data() : d;
      return `<div class="card"><div class="entry-meta">${esc(v.date||'')} · ${esc(v.type||'')}</div>${esc(v.text||'')}</div>`;
    }).join('');
  }catch(e){ el.innerHTML='<div class="empty">No entries yet.</div>'; }
}

async function addReminder(){
  const box = document.getElementById('remText');
  const text = box.value.trim();
  if(!text) return;
  box.value='';
  if(db && uid){
    const id = 'r'+Date.now();
    await db.collection('data/users/'+uid+'/reminders').doc(id).set({text,done:false,ts:Date.now()});
  }
  loadReminders();
}

async function toggleReminder(id,done){
  if(db && uid){
    await db.collection('data/users/'+uid+'/reminders').doc(id).update({done:!done});
  }
  loadReminders();
}
async function deleteReminder(id){
  if(db && uid){
    await db.collection('data/users/'+uid+'/reminders').doc(id).delete();
  }
  loadReminders();
}

async function loadReminders(){
  const el = document.getElementById('remList');
  if(!db || !uid){ el.innerHTML='<div class="empty">Sign in to sync reminders.</div>'; return; }
  try{
    const res = await db.collection('data/users/'+uid+'/reminders').orderBy('ts','desc').limit(50).get();
    const docs = res.docs || res || [];
    if(!docs.length){ el.innerHTML='<div class="empty">No reminders yet.</div>'; return; }
    el.innerHTML = docs.map(d=>{
      const v = d.data ? d.data() : d;
      const id = d.id || v.id;
      return `<div class="card rem-row">
        <input type="checkbox" ${v.done?'checked':''} onclick="toggleReminder('${id}',${!!v.done})">
        <span class="rem-text ${v.done?'done':''}" style="flex:1;">${esc(v.text||'')}</span>
        <button class="del" onclick="deleteReminder('${id}')">✕</button>
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML='<div class="empty">No reminders yet.</div>'; }
}

init();
</script>
</body>
</html>
